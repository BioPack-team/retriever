---
name: Upgrade uv.lock
on:
  schedule:
    - cron: 0 0 * * 0 # Run every Sunday at midnight
      timezone: "America/New_York"
  workflow_dispatch:
jobs:
  upgrade-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Upgrade uv.lock
        run: uv lock --upgrade
      - name: PR upgrade
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: upgrade uv.lock'
          title: 'Chore: periodic upgrade of uv.lock'
          body: Periodic dependency upgrade for `uv.lock` to avoid dependabot vulnerabilities.
          branch: actions/upgrade-uv-lock
          delete-branch: true
