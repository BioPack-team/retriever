components:
  schemas:
    ActiveJobRow:
      description: A single currently-in-flight job.
      properties:
        age_seconds:
          title: Age Seconds
          type: integer
        created:
          format: date-time
          title: Created
          type: string
        data_tier:
          anyOf:
          - type: integer
          - type: 'null'
          title: Data Tier
        job_id:
          title: Job Id
          type: string
        links:
          $ref: '#/components/schemas/Links'
        submitter:
          title: Submitter
          type: string
      required:
      - job_id
      - created
      - submitter
      - data_tier
      - age_seconds
      - links
      title: ActiveJobRow
      type: object
    ActivePage:
      description: A page of in-flight job rows.
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActiveJobRow'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: ActivePage
      type: object
    AllowList:
      additionalProperties: true
      description: List of operation providers (by infores ID) that may be used to
        complete operation.
      properties:
        allowlist:
          description: 'List of operation providers (by infores ID) that may be used
            to complete operation.


            No others will be used. A full list of operation providers for each operation
            with

            infores ID''s is available through the ''/services'' endpoint of the workflow
            runner.'
          examples:
          - infores:aragorn
          items:
            type: string
          minItems: 1
          title: Allowlist
          type: array
      required:
      - allowlist
      title: AllowList
      type: object
    Analysis-Input:
      additionalProperties: true
      description: An analysis for results from a non-Pathfinder query SHOULD have
        edge_bindings and SHOULD NOT have path_bindings.
      properties:
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Attribute-Input'
            type: array
          - type: 'null'
          description: The attributes of this particular Analysis.
          title: Attributes
        edge_bindings:
          additionalProperties:
            items:
              $ref: '#/components/schemas/EdgeBinding-Input'
            type: array
          description: 'The dictionary of input Query Graph to Knowledge Graph edge
            bindings where the dictionary keys are the key identifiers of the Query
            Graph edges and the associated values of those keys are instances of EdgeBinding
            schema type (see below).


            This value is an array of EdgeBindings since a given query edge may

            resolve to multiple Knowledge Graph Edges.'
          title: Edge Bindings
          type: object
        resource_id:
          description: The id of the resource generating this Analysis.
          title: Resource Id
          type: string
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: 'A numerical score associated with this result indicating the
            relevance or confidence of this result relative to others in the returned
            set.


            Higher MUST be better.'
          title: Score
        scoring_method:
          anyOf:
          - type: string
          - type: 'null'
          description: An identifier and link to an explanation for the method used
            to generate the score.
          title: Scoring Method
        support_graphs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'This is a list of references to Auxiliary Graph instances
            that supported the analysis of a Result as performed by the reasoning
            service.


            Each item in the list is the key of a single Auxiliary Graph.'
          title: Support Graphs
      required:
      - resource_id
      - edge_bindings
      title: Analysis
      type: object
    Analysis-Output:
      additionalProperties: true
      description: An analysis for results from a non-Pathfinder query SHOULD have
        edge_bindings and SHOULD NOT have path_bindings.
      properties:
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Attribute-Output'
            type: array
          - type: 'null'
          description: The attributes of this particular Analysis.
          title: Attributes
        edge_bindings:
          additionalProperties:
            items:
              $ref: '#/components/schemas/EdgeBinding-Output'
            type: array
          description: 'The dictionary of input Query Graph to Knowledge Graph edge
            bindings where the dictionary keys are the key identifiers of the Query
            Graph edges and the associated values of those keys are instances of EdgeBinding
            schema type (see below).


            This value is an array of EdgeBindings since a given query edge may

            resolve to multiple Knowledge Graph Edges.'
          title: Edge Bindings
          type: object
        resource_id:
          description: The id of the resource generating this Analysis.
          title: Resource Id
          type: string
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: 'A numerical score associated with this result indicating the
            relevance or confidence of this result relative to others in the returned
            set.


            Higher MUST be better.'
          title: Score
        scoring_method:
          anyOf:
          - type: string
          - type: 'null'
          description: An identifier and link to an explanation for the method used
            to generate the score.
          title: Scoring Method
        support_graphs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'This is a list of references to Auxiliary Graph instances
