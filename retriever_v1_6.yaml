    Result-Input:
      additionalProperties: true
      description: 'A Result object specifies the nodes and edges in the knowledge
        graph that satisfy the structure or conditions of a user-submitted query graph.


        It must contain a NodeBindings object (list of query graph node

        to knowledge graph node mappings) and a list of Analysis objects.'
      properties:
        analyses:
          description: The list of all Analysis components that contribute to the
            result.
          items:
            anyOf:
            - $ref: '#/components/schemas/Analysis-Input'
            - $ref: '#/components/schemas/PathfinderAnalysis-Input'
          title: Analyses
          type: array
        node_bindings:
          additionalProperties:
            items:
              $ref: '#/components/schemas/NodeBinding-Input'
            minItems: 1
            type: array
          description: 'The dictionary of Input Query Graph to Result Knowledge Graph
            node bindings where the dictionary keys are the key identifiers of the
            Query Graph nodes and the associated values of those keys are instances
            of NodeBinding schema type (see below).


            This value is an array of NodeBindings since a given query node may have
            multiple

            knowledge graph Node bindings in the result.'
          title: Node Bindings
          type: object
      required:
      - node_bindings
      - analyses
      title: Result
      type: object
    Result-Output:
      additionalProperties: true
      description: 'A Result object specifies the nodes and edges in the knowledge
        graph that satisfy the structure or conditions of a user-submitted query graph.


        It must contain a NodeBindings object (list of query graph node

        to knowledge graph node mappings) and a list of Analysis objects.'
      properties:
        analyses:
          description: The list of all Analysis components that contribute to the
            result.
          items:
            anyOf:
            - $ref: '#/components/schemas/Analysis-Output'
            - $ref: '#/components/schemas/PathfinderAnalysis-Output'
          title: Analyses
          type: array
        node_bindings:
          additionalProperties:
            items:
              $ref: '#/components/schemas/NodeBinding-Output'
            minItems: 1
            type: array
          description: 'The dictionary of Input Query Graph to Result Knowledge Graph
            node bindings where the dictionary keys are the key identifiers of the
            Query Graph nodes and the associated values of those keys are instances
            of NodeBinding schema type (see below).


            This value is an array of NodeBindings since a given query node may have
            multiple

            knowledge graph Node bindings in the result.'
          title: Node Bindings
          type: object
      required:
      - node_bindings
      - analyses
      title: Result
      type: object
    RetrievalSource:
      additionalProperties: true
      description: Provides information about how a particular InformationResource
        served as a source from which knowledge expressed in an Edge, or data used
        to generate this knowledge, was retrieved.
      properties:
        resource_id:
          description: The CURIE for an Information Resource that served as a source
            of knowledge expressed in an Edge, or a source of data used to generate
            this knowledge.
          title: Resource Id
          type: string
        resource_role:
          description: 'The role played by the InformationResource in serving as a
            source for an Edge.


            Note that a given Edge should have one

            and only one ''primary'' source, and may have any number of

            ''aggregator'' or ''supporting data'' sources.'
          enum:
          - primary_knowledge_source
          - aggregator_knowledge_source
          - supporting_data_source
          title: Resource Role
          type: string
        source_record_urls:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'A URL linking to a specific web page or document provided
            by the source, that contains a record of the knowledge expressed in the
            Edge.


            If the knowledge is contained in more than one web page on

            an Information Resource''s site, urls MAY be provided for each.

            For example, Therapeutic Targets Database (TTD) has separate web

            pages for ''Imatinib'' and its protein target KIT, both of which hold

            the claim that ''the KIT protein is a therapeutic target for Imatinib''.'
          title: Source Record Urls
        upstream_resource_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'An upstream InformationResource from which the resource being
            described directly retrieved a record of the knowledge expressed in the
            Edge, or data used to generate this knowledge.


            This is an array because there are cases where a merged Edge

            holds knowledge that was retrieved from multiple sources. e.g.

            an Edge provided by the ARAGORN ARA can expressing knowledge it

            retrieved from both the automat-mychem-info and molepro KPs,

            which both provided it with records of this single fact.'
          title: Upstream Resource Ids
      required:
      - resource_id
      - resource_role
      title: RetrievalSource
      type: object
    SchemaInfo:
      description: Information about the given knowledge schema.
      properties:
        edges:
          items:
            $ref: '#/components/schemas/EdgeInfo'
          title: Edges
          type: array
        edges_summary:
          $ref: '#/components/schemas/EdgeSummary'
        nodes:
          items:
