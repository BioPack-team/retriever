      title: OperationOverlay
      type: object
    OperationOverlayComputeJaccard:
      additionalProperties: true
      description: 'This operation computes the Jaccard Similarity which measures
        how many intermediate_node_key nodes are directly connected to both the end_node_keys
        nodes for all pairs of nodes with corresponding keys.


        It will then add edges to the knowledge graph along with edge attributes (with
        the

        property name jaccard_index) between each start_node_key and object_node_key.
        A

        query graph edge will also be added using the key specified by

        virtual_relation_label. This is used for purposes such as "find me all drugs

        (start_node_key) that have many proteins (intermediate_node_key) in common
        with

        this disease (end_node_key)." This can be used for downstream filtering to

        concentrate on relevant bioentities.'
      properties:
        id:
          const: overlay_compute_jaccard
          title: Id
          type: string
        parameters:
          $ref: '#/components/schemas/OverlayComputeJaccardParameters'
        runner_parameters:
          anyOf:
          - $ref: '#/components/schemas/AllowList'
          - $ref: '#/components/schemas/DenyList'
          - type: 'null'
          title: Runner Parameters
      required:
      - id
      - parameters
      title: OperationOverlayComputeJaccard
      type: object
    OperationOverlayComputeNgd:
      additionalProperties: true
      description: 'This operation computes the normalized Google distance (co-occurrence
        frequency) in PubMed abstracts and adds virual edges between qnodes AND/OR
        knodes AND/OR results edge bindings.


        If no publications are found infinity is returned.'
      properties:
        id:
          const: overlay_compute_ngd
          title: Id
          type: string
        parameters:
          $ref: '#/components/schemas/OverlayComputeNgdParameters'
        runner_parameters:
          anyOf:
          - $ref: '#/components/schemas/AllowList'
          - $ref: '#/components/schemas/DenyList'
          - type: 'null'
          title: Runner Parameters
      required:
      - id
      - parameters
      title: OperationOverlayComputeNgd
      type: object
    OperationOverlayConnectKnodes:
      additionalProperties: true
      description: 'Given a TRAPI message, create new kedges between existing knodes.


        These may be created using arbitrary methods or data sources, though provenance

        should be attached to the new kedges. Each new kedge is also added to all
        results

        containing node bindings to both the subject and object knodes.  This may
        be

        independent of any qedge connections, i.e. kedges can be created between any
        nodes

        in the kgraph.'
      properties:
        id:
          const: overlay_connect_knodes
          title: Id
          type: string
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
        runner_parameters:
          anyOf:
          - $ref: '#/components/schemas/AllowList'
          - $ref: '#/components/schemas/DenyList'
          - type: 'null'
          title: Runner Parameters
      required:
      - id
      title: OperationOverlayConnectKnodes
      type: object
    OperationOverlayFisherExactTest:
      additionalProperties: true
      description: 'Fisher exact test computes the Fisher''s Exact Test p-values of
        the connection between a list of given nodes with specified query id (subject_qnode_key
        e.g. n01) to their adjacent nodes with specified query id (object_qnode_key
        e.g. n02) in the message knowledge graph.


        This information is then added as an edge attribute to a virtual edge which
        is then

        added to the query graph and knowledge graph. It can also allow you to filter
        out

        the user-defined insignificance of connections based on a specified p-value
        cutoff

        or return the top n smallest p-value of connections and only add their corresponding

        virtual edges to the knowledge graph.'
      properties:
        id:
          const: overlay_fisher_exact_test
          title: Id
          type: string
        parameters:
          $ref: '#/components/schemas/OverlayFisherExactTestParameters'
        runner_parameters:
          anyOf:
          - $ref: '#/components/schemas/AllowList'
          - $ref: '#/components/schemas/DenyList'
          - type: 'null'
          title: Runner Parameters
      required:
      - id
      - parameters
      title: OperationOverlayFisherExactTest
      type: object
    OperationRestate:
