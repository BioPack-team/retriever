    KnowledgeGraph-Input:
      additionalProperties: true
      description: 'The knowledge graph associated with a set of results.


        The instances of Node and Edge defining this graph represent instances of

        biolink:NamedThing (concept nodes) and biolink:Association

        (relationship edges) representing (Attribute) annotated knowledge

        returned from the knowledge sources and inference agents wrapped by

        the given TRAPI implementation.'
      properties:
        edges:
          additionalProperties:
            $ref: '#/components/schemas/Edge-Input'
          description: Dictionary of Edge instances used in the KnowledgeGraph, referenced
            elsewhere in the TRAPI output by the dictionary key.
          title: Edges
          type: object
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/Node-Input'
          description: Dictionary of Node instances used in the KnowledgeGraph, referenced
            elsewhere in the TRAPI output by the dictionary key.
          title: Nodes
          type: object
      required:
      - nodes
      - edges
      title: KnowledgeGraph
      type: object
    KnowledgeGraph-Output:
      additionalProperties: true
      description: 'The knowledge graph associated with a set of results.


        The instances of Node and Edge defining this graph represent instances of

        biolink:NamedThing (concept nodes) and biolink:Association

        (relationship edges) representing (Attribute) annotated knowledge

        returned from the knowledge sources and inference agents wrapped by

        the given TRAPI implementation.'
      properties:
        edges:
          additionalProperties:
            $ref: '#/components/schemas/Edge-Output'
          description: Dictionary of Edge instances used in the KnowledgeGraph, referenced
            elsewhere in the TRAPI output by the dictionary key.
