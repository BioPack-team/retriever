          description: KnowledgeGraph object that contains lists of nodes and edges
            in the thought graph corresponding to the message.
        query_graph:
          anyOf:
          - $ref: '#/components/schemas/QueryGraph'
          - $ref: '#/components/schemas/PathfinderQueryGraph'
