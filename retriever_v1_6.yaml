            service.


            Each item in the list is the key of a single Auxiliary Graph.'
          title: Support Graphs
      required:
      - resource_id
      - edge_bindings
      title: Analysis
      type: object
    AnnotateEdgesParameters:
      additionalProperties: true
      description: Parameters for the AnnotateEdges operation.
      properties:
        attributes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'A list of attributes to annotate the edges with.


            If not included then all available data will be annotated.'
          examples:
          - pmids
          title: Attributes
      title: AnnotateEdgesParameters
      type: object
    AnnotateNodesParameters:
      additionalProperties: true
      description: Parameters for the AnnotateNodes operation.
      properties:
        attributes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'A list of attributes to annotate the nodes with.


            If not included then all available data will be annotated.'
          examples:
          - pmids
          title: Attributes
      title: AnnotateNodesParameters
      type: object
    AsyncQuery:
      additionalProperties: true
      description: AsyncQuery.
      properties:
        bypass_cache:
          default: false
          description: 'Set to true in order to request that the agent obtain

            fresh information from its sources in all cases where

            it has a viable choice between requesting fresh information

            in real time and using cached information.


            The agent receiving this flag MUST also include it in TRAPI sent to

            downstream sources (e.g., ARS -> ARAs -> KPs).'
          title: Bypass Cache
          type: boolean
        callback:
          description: 'Upon completion, this server will send a POST request to the

            callback URL with `Content-Type: application/json` header and

            request body containing a JSON-encoded `Response` object.

            The server MAY POST `Response` objects before work is fully

            complete to provide interim results with a Response.status

            value of ''Running''. If a POST operation to the callback URL

            does not succeed, the server SHOULD retry the POST at least

            once.'
          title: Callback
          type: string
        log_level:
          anyOf:
          - enum:
            - ERROR
            - WARNING
            - INFO
            - DEBUG
            type: string
          - type: 'null'
          description: The least critical level of logs to return.
          title: Log Level
        message:
          $ref: '#/components/schemas/Message-Input'
          description: 'The query Message is a serialization of the user request.


            Content of the Message object depends on the intended TRAPI operation.

            For example, the fill operation requires a non-empty query_graph field

            as part of the Message, whereas other operations, e.g. overlay,

            require non-empty results and knowledge_graph fields.'
        parameters:
          anyOf:
          - $ref: '#/components/schemas/Parameters'
          - type: 'null'
        submitter:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Any string for self-identifying the submitter of a query.


            The purpose of this optional field is to aid in the tracking of

            the source of queries for development and issue resolution.'
          title: Submitter
        workflow:
          anyOf:
          - items:
              discriminator:
                mapping:
                  annotate: '#/components/schemas/OperationAnnotate'
                  annotate_edges: '#/components/schemas/OperationAnnotateEdges'
                  annotate_nodes: '#/components/schemas/OperationAnnotateNodes'
                  bind: '#/components/schemas/OperationBind'
                  complete_results: '#/components/schemas/OperationCompleteResults'
                  enrich_results: '#/components/schemas/OperationEnrichResults'
                  fill: '#/components/schemas/OperationFill'
                  filter_kgraph: '#/components/schemas/OperationFilterKgraph'
                  filter_kgraph_continuous_kedge_attribute: '#/components/schemas/OperationFilterKgraphContinuousKedgeAttribute'
                  filter_kgraph_discrete_kedge_attribute: '#/components/schemas/OperationFilterKgraphDiscreteKedgeAttribute'
                  filter_kgraph_discrete_knode_attribute: '#/components/schemas/OperationFilterKgraphDiscreteKnodeAttribute'
                  filter_kgraph_orphans: '#/components/schemas/OperationFilterKgraphOrphans'
                  filter_kgraph_percentile: '#/components/schemas/OperationFilterKgraphPercentile'
                  filter_kgraph_std_dev: '#/components/schemas/OperationFilterKgraphStdDev'
                  filter_kgraph_top_n: '#/components/schemas/OperationFilterKgraphTopN'
                  filter_results: '#/components/schemas/OperationFilterResults'
                  filter_results_top_n: '#/components/schemas/OperationFilterResultsTopN'
                  lookup: '#/components/schemas/OperationLookup'
                  lookup_and_score: '#/components/schemas/OperationLookupAndScore'
                  overlay: '#/components/schemas/OperationOverlay'
                  overlay_compute_jaccard: '#/components/schemas/OperationOverlayComputeJaccard'
                  overlay_compute_ngd: '#/components/schemas/OperationOverlayComputeNgd'
                  overlay_connect_knodes: '#/components/schemas/OperationOverlayConnectKnodes'
                  overlay_fisher_exact_test: '#/components/schemas/OperationOverlayFisherExactTest'
                  restate: '#/components/schemas/OperationRestate'
                  score: '#/components/schemas/OperationScore'
                  sort_results: '#/components/schemas/OperationSortResults'
                  sort_results_edge_attribute: '#/components/schemas/OperationSortResultsEdgeAttribute'
                  sort_results_node_attribute: '#/components/schemas/OperationSortResultsNodeAttribute'
                  sort_results_score: '#/components/schemas/OperationSortResultsScore'
                propertyName: id
              oneOf:
              - $ref: '#/components/schemas/OperationAnnotate'
              - $ref: '#/components/schemas/OperationAnnotateEdges'
              - $ref: '#/components/schemas/OperationAnnotateNodes'
              - $ref: '#/components/schemas/OperationBind'
              - $ref: '#/components/schemas/OperationCompleteResults'
              - $ref: '#/components/schemas/OperationEnrichResults'
              - $ref: '#/components/schemas/OperationFill'
              - $ref: '#/components/schemas/OperationFilterKgraph'
              - $ref: '#/components/schemas/OperationFilterKgraphContinuousKedgeAttribute'
              - $ref: '#/components/schemas/OperationFilterKgraphDiscreteKedgeAttribute'
              - $ref: '#/components/schemas/OperationFilterKgraphDiscreteKnodeAttribute'
              - $ref: '#/components/schemas/OperationFilterKgraphOrphans'
              - $ref: '#/components/schemas/OperationFilterKgraphPercentile'
              - $ref: '#/components/schemas/OperationFilterKgraphStdDev'
              - $ref: '#/components/schemas/OperationFilterKgraphTopN'
              - $ref: '#/components/schemas/OperationFilterResults'
              - $ref: '#/components/schemas/OperationFilterResultsTopN'
              - $ref: '#/components/schemas/OperationLookup'
              - $ref: '#/components/schemas/OperationLookupAndScore'
              - $ref: '#/components/schemas/OperationOverlay'
              - $ref: '#/components/schemas/OperationOverlayComputeJaccard'
              - $ref: '#/components/schemas/OperationOverlayComputeNgd'
              - $ref: '#/components/schemas/OperationOverlayConnectKnodes'
              - $ref: '#/components/schemas/OperationOverlayFisherExactTest'
              - $ref: '#/components/schemas/OperationRestate'
              - $ref: '#/components/schemas/OperationScore'
              - $ref: '#/components/schemas/OperationSortResults'
              - $ref: '#/components/schemas/OperationSortResultsEdgeAttribute'
              - $ref: '#/components/schemas/OperationSortResultsNodeAttribute'
              - $ref: '#/components/schemas/OperationSortResultsScore'
            type: array
          - type: 'null'
          description: List of workflow steps to be executed.
          title: Workflow
      required:
      - message
      - callback
      title: AsyncQuery
      type: object
    AsyncQueryResponse:
      additionalProperties: true
      description: The AsyncQueryResponse object contains a payload that must be returned
        from a submitted async_query.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: A brief human-readable description of the result of the async_query
            submission.
          title: Description
        job_id:
          description: An identifier for the submitted job that can be used with /async_query_status
            to receive an update on the status of the job.
          title: Job Id
          type: string
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: 'One of a standardized set of short codes: e.g. Accepted, QueryNotTraversable,
            KPsNotAvailable'
          title: Status
      required:
      - job_id
      title: AsyncQueryResponse
      type: object
    AsyncQueryStatusResponse:
      additionalProperties: true
      description: The AsyncQueryStatusResponse object contains a payload that describes
        the current status of a previously submitted async_query.
      properties:
        description:
          description: A brief human-readable description of the current state or
            summary of the problem if the status is Failed.
          title: Description
          type: string
        logs:
          description: 'A list of LogEntry items, containing errors, warnings, debugging
            information, etc.


            List items MUST be in chronological order with

            earliest first. The most recent entry should be last. Its timestamp

            will be compared against the current time to see if there is

            still activity.'
          items:
            $ref: '#/components/schemas/LogEntry'
          minItems: 1
          title: Logs
          type: array
        response_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional URL that can be queried to restrieve the full TRAPI
            Response.
          title: Response Url
        status:
          description: 'One of a standardized set of short codes: Queued, Running,
            Completed, Failed'
          title: Status
          type: string
      required:
      - status
      - description
      - logs
      title: AsyncQueryStatusResponse
      type: object
    Attribute-Input:
      additionalProperties: false
      description: 'Generic attribute for a node or an edge that expands the key-value
        pair concept by including fields for additional metadata.


        These fields can be used to describe the source of the statement made in a
        key-value

        pair of the attribute object, or describe the attribute''s value itself

        including its semantic type, or a url providing additional information

        about it. An attribute may be further qualified with sub-attributes

        (for example to provide confidence intervals on a value).'
      properties:
        attribute_source:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The source of the core assertion made by the key-value pair
            of an attribute object.


            Use a CURIE or namespace designator for this resource where possible.'
          title: Attribute Source
        attribute_type_id:
          description: 'The ''key'' of the attribute object, holding a CURIE of an
            ontology property defining the attribute (preferably the CURIE of a Biolink
            association slot).


            This property captures the relationship asserted to hold between the value
            of the attribute, and the node

            or edge from  which it hangs. For example, that a value of

            ''0.000153'' represents a p-value supporting an edge, or that

            a value of ''ChEMBL'' represents the original source of the knowledge

            expressed in the edge.'
          title: Attribute Type Id
          type: string
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Attribute-Input'
            type: array
          - type: 'null'
          description: A list of attributes providing further information about the
            parent attribute (for example to provide provenance information about
            the parent attribute).
          title: Attributes
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-readable description for the attribute and its value.
          title: Description
        original_attribute_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The term used by the original source of an attribute to describe
            the meaning or significance of the value it captures.


            This may be a column name in a source tsv file, or a key in a source json

            document for the field in the data that held the attribute''s

            value. Capturing this information  where possible lets us preserve

            what the original source said. Note that the data type is string''

            but the contents of the field could also be a CURIE of a third

            party ontology term.'
          title: Original Attribute Name
        value:
          description: Value of the attribute. May be any data type, including a list.
          not:
            type: 'null'
          title: Value
        value_type_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 'CURIE describing the semantic type of an  attribute''s value.


            Use a Biolink class if possible, otherwise a term from an external

            ontology. If a suitable CURIE/identifier does not exist, enter a

            descriptive phrase here and submit the new type for consideration

            by the appropriate authority.'
          title: Value Type Id
        value_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-consumable URL linking to a web document that provides
            additional information about an attribute's value (not the node or the
            edge fom which it hangs).
          title: Value Url
      required:
      - attribute_type_id
      - value
      title: Attribute
      type: object
    Attribute-Output:
      additionalProperties: false
      description: 'Generic attribute for a node or an edge that expands the key-value
        pair concept by including fields for additional metadata.


        These fields can be used to describe the source of the statement made in a
        key-value

        pair of the attribute object, or describe the attribute''s value itself

        including its semantic type, or a url providing additional information

        about it. An attribute may be further qualified with sub-attributes

        (for example to provide confidence intervals on a value).'
      properties:
        attribute_source:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The source of the core assertion made by the key-value pair
            of an attribute object.


            Use a CURIE or namespace designator for this resource where possible.'
          title: Attribute Source
        attribute_type_id:
          description: 'The ''key'' of the attribute object, holding a CURIE of an
            ontology property defining the attribute (preferably the CURIE of a Biolink
            association slot).


            This property captures the relationship asserted to hold between the value
            of the attribute, and the node

            or edge from  which it hangs. For example, that a value of

            ''0.000153'' represents a p-value supporting an edge, or that

            a value of ''ChEMBL'' represents the original source of the knowledge

            expressed in the edge.'
          title: Attribute Type Id
          type: string
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Attribute-Output'
            type: array
          - type: 'null'
          description: A list of attributes providing further information about the
            parent attribute (for example to provide provenance information about
            the parent attribute).
          title: Attributes
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-readable description for the attribute and its value.
          title: Description
        original_attribute_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The term used by the original source of an attribute to describe
            the meaning or significance of the value it captures.


            This may be a column name in a source tsv file, or a key in a source json

            document for the field in the data that held the attribute''s

            value. Capturing this information  where possible lets us preserve

            what the original source said. Note that the data type is string''

            but the contents of the field could also be a CURIE of a third

            party ontology term.'
          title: Original Attribute Name
        value:
          description: Value of the attribute. May be any data type, including a list.
          not:
            type: 'null'
          title: Value
        value_type_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 'CURIE describing the semantic type of an  attribute''s value.


            Use a Biolink class if possible, otherwise a term from an external

            ontology. If a suitable CURIE/identifier does not exist, enter a

            descriptive phrase here and submit the new type for consideration

            by the appropriate authority.'
          title: Value Type Id
        value_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-consumable URL linking to a web document that provides
            additional information about an attribute's value (not the node or the
            edge fom which it hangs).
          title: Value Url
      required:
      - attribute_type_id
      - value
      title: Attribute
      type: object
    AttributeConstraint:
      additionalProperties: false
      description: Generic query constraint for a query node or query edge.
      properties:
        id:
          description: 'CURIE of the concept being constrained.


            For properties defined by the Biolink model this SHOULD be a biolink CURIE.

            otherwise, if possible, from the EDAM ontology. If a suitable

            CURIE does not exist, enter a descriptive phrase here and

            submit the new type for consideration by the appropriate

            authority.'
          title: Id
          type: string
        name:
          description: 'Human-readable name or label for the constraint concept.


            If appropriate, it SHOULD be the term name of the CURIE used

            as the ''id''. This is redundant but required for human

            readability.'
          title: Name
          type: string
        not:
          default: false
          description: Negate the operator.
          title: Not
          type: boolean
        operator:
          description: 'Relationship between the database value and the constraint
            value for the specified id.


            The operators ==, >, and < mean is equal to, is greater than, and is less
            than,

            respectively. The ''matches'' operator indicates that the value

            is a regular expression to be evaluated. If value is a list type,

            then at least one evaluation must be true (equivalent to OR).

            This means that the == operator with a list acts like a SQL ''IN''

            clause. If the value of the compared attribute is a list, then

            comparisons are performed between each of the constraint values

            and each of the attribute values, and any one true evaluation

            counts as an overall true (e.g., [1,2,3] == [6,7,2] is true).

            The == operator is therefore a broad interpretation of inclusion.

            The ''==='' operator requires that the constraint value and

            the attribute value be the same data type, length,

            content, and order (e.g. only [1,2,3] === [1,2,3]).

            The ''not'' property negates the operator such that not

            and == means ''not equal to'' (or ''not in'' for a list), and not >

            means <=, and not < means >=, not matches means does not

            match, and not === means the match between the constraint

            and attribute values are not exact.

            The ''=='' operator SHOULD NOT be used in a manner that

            describes an "is a" subclass relationship for the parent QNode.'
          enum:
          - ==
          - ===
          - '>'
          - <
          - matches
          title: Operator
          type: string
        unit_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 'CURIE of the units of the value or list of values in the ''value''
            property.


            The Units of Measurement Ontology (UO) should be used

            if possible. The unit_id MUST be provided for (lists of)

            numerical values that correspond to a quantity that has units.'
          title: Unit Id
        unit_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Term name that is associated with the CURIE of the units of
            the value or list of values in the ''value'' property.


            The Units of Measurement Ontology (UO) SHOULD be used

            if possible. This property SHOULD be provided if a unit_id is

            provided. This is redundant but recommended for human readability.'
          title: Unit Name
        value:
          description: 'Value of the attribute.


            May be any data type, including a list.

            If the value is a list and there are multiple items, at least one

            comparison must be true (equivalent to OR) unless the ''===''

            operator is used. If ''value'' is of data

            type ''object'', the keys of the object MAY be treated as a list.

            A ''list'' data type paired with the ''>'' or ''<'' operators will

            encode extraneous comparisons, but this is permitted as it is in

            SQL and other languages.'
          not:
            type: 'null'
          title: Value
      required:
      - id
      - name
      - operator
      - value
      title: AttributeConstraint
      type: object
    AuxiliaryGraph-Input:
