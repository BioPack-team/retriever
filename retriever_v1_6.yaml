      title: OperationSortResultsScore
      type: object
    OverlayComputeJaccardParameters:
      additionalProperties: true
      description: Parameters for the OverlayComputeJaccard operation.
      properties:
        end_node_keys:
          description: A list of qnode keys specifying the ending nodes.
          examples:
          - '[n0, n2]'
          items:
            type: string
          title: End Node Keys
          type: array
        intermediate_node_key:
          description: A qnode key specifying the intermediate node.
          examples:
          - n1
          title: Intermediate Node Key
          type: string
        virtual_relation_label:
          description: The key of the query graph edge that corresponds to the knowledge
            graph edges that were added by this operation.
          examples:
          - J1
          title: Virtual Relation Label
          type: string
      required:
      - intermediate_node_key
      - end_node_keys
      - virtual_relation_label
      title: OverlayComputeJaccardParameters
      type: object
    OverlayComputeNgdParameters:
      additionalProperties: true
      description: Parameters for the OverlayComputeNgd operation.
      properties:
        qnode_keys:
          description: 'A list of qnode keys to overlay pairwise edges onto.


            Must be be a list of at least 2 valid qnodes.'
          examples:
          - '[n00, n01]'
          items:
            type: string
          title: Qnode Keys
          type: array
        virtual_relation_label:
          description: An label to help identify the virtual edge in the relation
            field.
          examples:
          - NGD1
          title: Virtual Relation Label
          type: string
      required:
      - virtual_relation_label
      - qnode_keys
      title: OverlayComputeNgdParameters
      type: object
    OverlayFisherExactTestParameters:
      additionalProperties: true
      description: Parameters for the OverlayFisherExactTest operation.
      properties:
        object_qnode_key:
          description: A specific object query node id.
          examples:
          - n2
          title: Object Qnode Key
          type: string
        rel_edge_key:
          anyOf:
          - type: string
          - type: 'null'
          description: A specific Qedge id connected to both subject nodes and object
            nodes in message KG (optional, otherwise all edges connected to both subject
            nodes and object nodes in message KG are considered).
          examples:
          - e01
          title: Rel Edge Key
        subject_qnode_key:
          description: A specific subject query node id.
          examples:
          - n1
          title: Subject Qnode Key
          type: string
        virtual_relation_label:
          description: An label to help identify the virtual edge.
          examples:
          - f1
          title: Virtual Relation Label
          type: string
      required:
      - subject_qnode_key
      - object_qnode_key
      - virtual_relation_label
      title: OverlayFisherExactTestParameters
      type: object
    Parameters:
      additionalProperties: true
      description: Parameters that govern some elements of query execution behavior.
      properties:
        dehydrated:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Respond without node/edge properties for faster response. Currently
            only supported for Tier 0.
          title: Dehydrated
        tier:
          anyOf:
          - description: Data Tiers (0-2) to use. Defaults to 0 if unset.
            maximum: 2.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Tier
        tier_fallback:
          default: true
          description: "When the requested tier is down, fall back to the other implemented\
            \ tier (T0 \u2194 T1). Set False to require the requested tier and 424\
            \ if it's unavailable. Default True. Has no effect on T2 (no fallback\
            \ peer)."
          title: Tier Fallback
          type: boolean
        tiers:
          anyOf:
          - items:
              description: Data Tiers (0-2) to use. Defaults to 0 if unset.
              maximum: 2.0
              minimum: 0.0
              type: integer
            maxItems: 1
            type: array
          - type: 'null'
          deprecated: true
          description: 'Which tier to use. Only supports 1 tier at a time. DEPRECATED:
            Use `tier` instead.'
          title: Tiers
        timeout:
          anyOf:
          - type: number
          - type: 'null'
          description: Custom query timeout in seconds. Defaults to server default
            if not set. Set to -1 to disable timeout entirely.
          title: Timeout
      title: Parameters
      type: object
    PathBinding:
      additionalProperties: true
      description: 'A instance of PathBinding is a single binding of an input QueryGraph
        path (the key to this object) with the AuxiliaryGraph id containing a list
        of edges in the path.


        The Auxiliary Graph does not convey any order of edges in the path.'
      properties:
        id:
          description: The key identifier of a specific auxiliary graph.
          title: Id
          type: string
      required:
      - id
      title: PathBinding
      type: object
    PathConstraint:
      additionalProperties: true
      description: A constraint for paths. ARAs must comply with constraints when
        finding paths.
      properties:
        intermediate_categories:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: 'A list of Biolink model categories by which to constrain paths
            returned.


            If multiple categories are listed, it should be interpreted as an AND

            relationship. Each path returned by ARAs MUST contain at least one node

            of each category listed.'
          title: Intermediate Categories
      title: PathConstraint
      type: object
    PathfinderAnalysis-Input:
      additionalProperties: true
      description: An analysis for results from a Pathfinder query SHOULD have path_bindings
        and SHOULD NOT have edge_bindings.
      properties:
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Attribute-Input'
            type: array
          - type: 'null'
          description: The attributes of this particular Analysis.
          title: Attributes
        path_bindings:
          additionalProperties:
            items:
              $ref: '#/components/schemas/PathBinding'
            type: array
          description: The dictionary of input Query Graph paths to Analysis paths,
            specifically only for pathfinder queries.
          title: Path Bindings
          type: object
        resource_id:
          description: The id of the resource generating this Analysis.
          title: Resource Id
          type: string
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: 'A numerical score associated with this result indicating the
            relevance or confidence of this result relative to others in the returned
            set.


            Higher MUST be better.'
          title: Score
        scoring_method:
          anyOf:
          - type: string
          - type: 'null'
          description: An identifier and link to an explanation for the method used
            to generate the score.
          title: Scoring Method
        support_graphs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'This is a list of references to Auxiliary Graph instances
            that supported the analysis of a Result as performed by the reasoning
            service.


            Each item in the list is the key of a single Auxiliary Graph.'
          title: Support Graphs
      required:
      - resource_id
      - path_bindings
      title: PathfinderAnalysis
      type: object
    PathfinderAnalysis-Output:
      additionalProperties: true
      description: An analysis for results from a Pathfinder query SHOULD have path_bindings
        and SHOULD NOT have edge_bindings.
      properties:
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Attribute-Output'
            type: array
          - type: 'null'
          description: The attributes of this particular Analysis.
          title: Attributes
        path_bindings:
          additionalProperties:
            items:
              $ref: '#/components/schemas/PathBinding'
            type: array
          description: The dictionary of input Query Graph paths to Analysis paths,
            specifically only for pathfinder queries.
          title: Path Bindings
          type: object
        resource_id:
          description: The id of the resource generating this Analysis.
          title: Resource Id
          type: string
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: 'A numerical score associated with this result indicating the
            relevance or confidence of this result relative to others in the returned
            set.


            Higher MUST be better.'
          title: Score
        scoring_method:
          anyOf:
          - type: string
          - type: 'null'
          description: An identifier and link to an explanation for the method used
            to generate the score.
          title: Scoring Method
        support_graphs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'This is a list of references to Auxiliary Graph instances
            that supported the analysis of a Result as performed by the reasoning
            service.


            Each item in the list is the key of a single Auxiliary Graph.'
          title: Support Graphs
      required:
      - resource_id
      - path_bindings
      title: PathfinderAnalysis
      type: object
    PathfinderQueryGraph:
      additionalProperties: true
      description: A Pathfinder query SHOULD have paths following the QPath schema
        and SHOULD NOT have edges.
      properties:
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/QNode'
          description: 'The node specifications.


            The keys of this map are unique node

            identifiers and the corresponding values include the constraints

            on bound nodes.'
          title: Nodes
          type: object
        paths:
          additionalProperties:
            $ref: '#/components/schemas/QPath'
          description: 'The QueryGraph path specification, used only for pathfinder
            type queries.


            The keys of this map are unique path identifiers and the

            corresponding values include the constraints on bound paths, in

            addition to specifying the subject, object, and intermediate QNodes.'
          maxProperties: 1
          minProperties: 1
          title: Paths
          type: object
      required:
      - nodes
      - paths
      title: PathfinderQueryGraph
      type: object
    QEdge:
      additionalProperties: true
      description: 'An edge in the QueryGraph used as a filter pattern specification
        in a query.


        If the optional predicate property is not specified,

        it is assumed to be a wildcard match to the target knowledge space.

        If specified, the ontological inheritance hierarchy associated with

        the term provided is assumed, such that edge bindings returned may be

        an exact match to the given QEdge predicate term,

        or to a term that is a descendant of the QEdge predicate term.'
      properties:
        attribute_constraints:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeConstraint'
            type: array
          - type: 'null'
          description: A list of attribute constraints applied to a query edge. If
            there are multiple items, they must all be true (equivalent to AND).
          title: Attribute Constraints
        knowledge_type:
          anyOf:
          - enum:
            - lookup
            - inferred
            type: string
          - type: 'null'
          description: 'Indicates the type of knowledge that the client wants from
            the server between the subject and object.


            If the value is ''lookup'', then the client wants direct lookup information
            from

            knowledge sources. If the value is ''inferred'', then the client

            wants the server to get creative and connect the subject and

            object in more speculative and non-direct-lookup ways. If this

            property is absent or null, it MUST be assumed to mean

            ''lookup''. This feature is currently experimental and may be

            further extended in the future.'
          title: Knowledge Type
        object:
          description: Corresponds to the map key identifier of the object concept
            node anchoring the query filter pattern for the query relationship edge.
          title: Object
          type: string
        predicates:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: 'These should be Biolink Model predicates and are allowed to
            be of type ''abstract'' or ''mixin'' (only in QGraphs!).


            Use of ''deprecated'' predicates should be avoided.'
          title: Predicates
        qualifier_constraints:
          anyOf:
          - items:
              $ref: '#/components/schemas/QualifierConstraint'
            type: array
          - type: 'null'
          description: 'A list of QualifierConstraints that provide nuance to the
            QEdge.


            If multiple QualifierConstraints are provided, there is an OR

            relationship between them. If the QEdge has multiple

            predicates or if the QNodes that correspond to the subject or

            object of this QEdge have multiple categories or multiple

            curies, then qualifier_constraints MUST NOT be specified

            because these complex use cases are not supported at this time.'
          title: Qualifier Constraints
        subject:
          description: Corresponds to the map key identifier of the subject concept
            node anchoring the query filter pattern for the query relationship edge.
          title: Subject
          type: string
      required:
      - subject
      - object
      title: QEdge
      type: object
    QNode:
      additionalProperties: true
      description: 'A node in the QueryGraph used to represent an entity in a query.


        If a CURIE is not specified, any nodes matching the category

        of the QNode will be returned in the Results.'
      properties:
        categories:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: 'These should be Biolink Model categories and are allowed to
            be of type ''abstract'' or ''mixin'' (only in QGraphs!).


            Use of ''deprecated'' categories should be avoided.'
          title: Categories
        constraints:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttributeConstraint'
            type: array
          - type: 'null'
          description: 'A list of constraints applied to a query node.


            If there are multiple items, they must all be true (equivalent to AND).'
          title: Constraints
        ids:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: 'A CURIE identifier (or list of identifiers) for this node.


            The ''ids'' field will hold a list of CURIEs only in the case of a

            BATCH set_interpretation, where each CURIE is queried

            separately. If a list of queried CURIEs is to be considered as a

            set (as under a MANY or ALL set_interpretation), the ''ids'' field

            will hold a single id representing this set, and the individual members

            of this set will be captured in a separate ''member_ids'' field.

            Note that the set id MUST be created as a UUID by the system that

            defines the queried set, using a centralized nodenorm service.

            Note also that downstream systems MUST re-use the original set UUID

            in the messages they create/send, which will facilitate merging or

            caching operations.'
          title: Ids
        member_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'A list of CURIE identifiers for members of a queried set.


            This field MUST be populated under a set_interpretation of MANY

            or ALL, when the ''ids'' field holds a UUID representing the set

            itself. This field MUST NOT be used under a set_interpretation

            of BATCH.'
          title: Member Ids
        set_interpretation:
          anyOf:
          - enum:
            - BATCH
            - MANY
            - ALL
            type: string
          - type: 'null'
          description: 'Indicates how multiple CURIEs in the ids property MUST be
            interpreted.


            BATCH indicates that the query is intended to be

            a batch query and each CURIE is treated independently. ALL means

            that all specified CURIES MUST appear in each Result.

            MANY means that member CURIEs MUST form one or more

            sets in the Results, and sets with more members are generally

            considered more desirable that sets with fewer members.

            If this property is missing or null, the default is BATCH.'
          title: Set Interpretation
      title: QNode
      type: object
    QPath:
      additionalProperties: true
      description: 'A path in the QueryGraph used for pathfinder queries.


        Both subject and object MUST reference QNodes that have a CURIE in their ids
        field.

        Paths returned that bind to this QPath can represent some

        relationship between subject and object.'
      properties:
        constraints:
          anyOf:
          - items:
              $ref: '#/components/schemas/PathConstraint'
            minItems: 1
            type: array
          - type: 'null'
          description: 'A list of constraints for the QPath.


            If multiple constraints are listed, it should be interpreted as an OR
            relationship. Each path returned is

            required to comply with at least one constraint.'
          title: Constraints
        object:
          description: Corresponds to the map key identifier of the object concept
            node for the end of the queried path.
          title: Object
          type: string
        predicates:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: 'QPath predicates are intended to convey what type of paths
            are desired, NOT a constraint on the types of predicates that may be in
            result paths.


            If no predicate is listed, the ARA SHOULD find paths such that the

            relationship represented by the path is a "related_to" relationship.

            These should be Biolink Model predicates and are allowed to be of type

            ''abstract'' or ''mixin'' (only in QGraphs!). Use of ''deprecated''

            predicates should be avoided.'
          title: Predicates
        subject:
          description: Corresponds to the map key identifier of the subject concept
            node for the start of the queried path.
          title: Subject
          type: string
      required:
      - subject
      - object
      title: QPath
      type: object
    Qualifier:
      additionalProperties: false
      description: An additional nuance attached to an assertion.
      properties:
        qualifier_type_id:
          description: 'CURIE for a Biolink ''qualifier'' association slot, generally
            taken from Biolink association slots designated for this purpose (that
            is, association slots with names ending in ''qualifier'') e.g. biolink:subject_aspect_qualifier,  biolink:subject_direction_qualifier,
            biolink:object_aspect_qualifier, etc. Such qualifiers are used to elaborate
            a second layer of meaning of a knowledge graph edge.


            Available qualifiers are edge properties in the Biolink Model (see

            https://biolink.github.io/biolink-model/docs/edge_properties.html)

            which have slot names with the suffix string ''qualifier''.'
          title: Qualifier Type Id
          type: string
        qualifier_value:
          description: 'The value associated with the type of the qualifier, drawn
            from a set of controlled values by the type as specified in the Biolink
            model (e.g. ''expression'' or ''abundance'' for the qualifier type ''biolink:subject_aspect_qualifier'',
            etc).


            The enumeration of qualifier values for a given qualifier

            type is generally going to be constrained by the category

            of edge (i.e. biolink:Association subtype) of the (Q)Edge.'
          title: Qualifier Value
          type: string
      required:
      - qualifier_type_id
      - qualifier_value
      title: Qualifier
      type: object
    QualifierConstraint:
      additionalProperties: false
      description: 'Defines a query constraint based on the qualifier_types and qualifier_values
        of a set of Qualifiers attached to an edge.


        For example, it can constrain a

        "ChemicalX - affects - ?Gene" query to return only edges where

        ChemicalX specifically affects the ''expression'' of the Gene, by

        constraining on the qualifier_type "biolink:object_aspect_qualifier"

        with a qualifier_value of "expression".'
      properties:
        qualifier_set:
          description: A set of Qualifiers that serves to add nuance to a query, by
            constraining allowed values held by Qualifiers on queried Edges.
          items:
            $ref: '#/components/schemas/Qualifier'
          title: Qualifier Set
          type: array
      required:
      - qualifier_set
      title: QualifierConstraint
      type: object
    Query:
      additionalProperties: true
      description: Request.
      properties:
        bypass_cache:
          default: false
          description: 'Set to true in order to request that the agent obtain

            fresh information from its sources in all cases where

            it has a viable choice between requesting fresh information

            in real time and using cached information.


            The agent receiving this flag MUST also include it in TRAPI sent to

            downstream sources (e.g., ARS -> ARAs -> KPs).'
          title: Bypass Cache
          type: boolean
        log_level:
          anyOf:
          - enum:
            - ERROR
            - WARNING
            - INFO
            - DEBUG
            type: string
          - type: 'null'
          description: The least critical level of logs to return.
          title: Log Level
        message:
          $ref: '#/components/schemas/Message-Input'
          description: 'The query Message is a serialization of the user request.


            Content of the Message object depends on the intended TRAPI operation.

            For example, the fill operation requires a non-empty query_graph field

            as part of the Message, whereas other operations, e.g. overlay,

            require non-empty results and knowledge_graph fields.'
        parameters:
          anyOf:
          - $ref: '#/components/schemas/Parameters'
          - type: 'null'
        submitter:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Any string for self-identifying the submitter of a query.


            The purpose of this optional field is to aid in the tracking of

            the source of queries for development and issue resolution.'
          title: Submitter
        workflow:
          anyOf:
          - items:
              discriminator:
                mapping:
                  annotate: '#/components/schemas/OperationAnnotate'
                  annotate_edges: '#/components/schemas/OperationAnnotateEdges'
                  annotate_nodes: '#/components/schemas/OperationAnnotateNodes'
                  bind: '#/components/schemas/OperationBind'
                  complete_results: '#/components/schemas/OperationCompleteResults'
                  enrich_results: '#/components/schemas/OperationEnrichResults'
                  fill: '#/components/schemas/OperationFill'
                  filter_kgraph: '#/components/schemas/OperationFilterKgraph'
                  filter_kgraph_continuous_kedge_attribute: '#/components/schemas/OperationFilterKgraphContinuousKedgeAttribute'
                  filter_kgraph_discrete_kedge_attribute: '#/components/schemas/OperationFilterKgraphDiscreteKedgeAttribute'
                  filter_kgraph_discrete_knode_attribute: '#/components/schemas/OperationFilterKgraphDiscreteKnodeAttribute'
                  filter_kgraph_orphans: '#/components/schemas/OperationFilterKgraphOrphans'
                  filter_kgraph_percentile: '#/components/schemas/OperationFilterKgraphPercentile'
                  filter_kgraph_std_dev: '#/components/schemas/OperationFilterKgraphStdDev'
                  filter_kgraph_top_n: '#/components/schemas/OperationFilterKgraphTopN'
                  filter_results: '#/components/schemas/OperationFilterResults'
                  filter_results_top_n: '#/components/schemas/OperationFilterResultsTopN'
                  lookup: '#/components/schemas/OperationLookup'
                  lookup_and_score: '#/components/schemas/OperationLookupAndScore'
                  overlay: '#/components/schemas/OperationOverlay'
                  overlay_compute_jaccard: '#/components/schemas/OperationOverlayComputeJaccard'
                  overlay_compute_ngd: '#/components/schemas/OperationOverlayComputeNgd'
                  overlay_connect_knodes: '#/components/schemas/OperationOverlayConnectKnodes'
                  overlay_fisher_exact_test: '#/components/schemas/OperationOverlayFisherExactTest'
                  restate: '#/components/schemas/OperationRestate'
                  score: '#/components/schemas/OperationScore'
                  sort_results: '#/components/schemas/OperationSortResults'
                  sort_results_edge_attribute: '#/components/schemas/OperationSortResultsEdgeAttribute'
                  sort_results_node_attribute: '#/components/schemas/OperationSortResultsNodeAttribute'
                  sort_results_score: '#/components/schemas/OperationSortResultsScore'
                propertyName: id
              oneOf:
              - $ref: '#/components/schemas/OperationAnnotate'
              - $ref: '#/components/schemas/OperationAnnotateEdges'
              - $ref: '#/components/schemas/OperationAnnotateNodes'
              - $ref: '#/components/schemas/OperationBind'
              - $ref: '#/components/schemas/OperationCompleteResults'
              - $ref: '#/components/schemas/OperationEnrichResults'
              - $ref: '#/components/schemas/OperationFill'
              - $ref: '#/components/schemas/OperationFilterKgraph'
              - $ref: '#/components/schemas/OperationFilterKgraphContinuousKedgeAttribute'
              - $ref: '#/components/schemas/OperationFilterKgraphDiscreteKedgeAttribute'
              - $ref: '#/components/schemas/OperationFilterKgraphDiscreteKnodeAttribute'
              - $ref: '#/components/schemas/OperationFilterKgraphOrphans'
              - $ref: '#/components/schemas/OperationFilterKgraphPercentile'
              - $ref: '#/components/schemas/OperationFilterKgraphStdDev'
              - $ref: '#/components/schemas/OperationFilterKgraphTopN'
              - $ref: '#/components/schemas/OperationFilterResults'
              - $ref: '#/components/schemas/OperationFilterResultsTopN'
              - $ref: '#/components/schemas/OperationLookup'
              - $ref: '#/components/schemas/OperationLookupAndScore'
              - $ref: '#/components/schemas/OperationOverlay'
              - $ref: '#/components/schemas/OperationOverlayComputeJaccard'
              - $ref: '#/components/schemas/OperationOverlayComputeNgd'
              - $ref: '#/components/schemas/OperationOverlayConnectKnodes'
              - $ref: '#/components/schemas/OperationOverlayFisherExactTest'
              - $ref: '#/components/schemas/OperationRestate'
              - $ref: '#/components/schemas/OperationScore'
              - $ref: '#/components/schemas/OperationSortResults'
              - $ref: '#/components/schemas/OperationSortResultsEdgeAttribute'
              - $ref: '#/components/schemas/OperationSortResultsNodeAttribute'
              - $ref: '#/components/schemas/OperationSortResultsScore'
            type: array
          - type: 'null'
          description: List of workflow steps to be executed.
          title: Workflow
      required:
      - message
      title: Query
      type: object
    QueryGraph:
      additionalProperties: true
      description: A non-Pathfinder query SHOULD have edges following the QEdge schema
        and SHOULD NOT have paths.
      properties:
        edges:
          additionalProperties:
            $ref: '#/components/schemas/QEdge'
          description: 'The edge specifications.


            The keys of this map are unique edge

            identifiers and the corresponding values include the constraints

            on bound edges, in addition to specifying the subject and object QNodes.'
          title: Edges
          type: object
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/QNode'
          description: 'The node specifications.


            The keys of this map are unique node

            identifiers and the corresponding values include the constraints

            on bound nodes.'
          title: Nodes
          type: object
      required:
      - nodes
      - edges
      title: QueryGraph
      type: object
    Response:
      additionalProperties: true
      description: Response.
      properties:
        biolink_version:
          anyOf:
          - type: string
          - type: 'null'
          description: Version label of the Biolink model used in this document.
          title: Biolink Version
        data_release_versions:
          anyOf:
          - $ref: '#/components/schemas/DataReleaseVersions'
          - type: 'null'
          description: Release versions of knowledge sources used to answer the query.
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: A brief human-readable description of the outcome.
          title: Description
        logs:
          anyOf:
          - items:
              $ref: '#/components/schemas/LogEntry'
            type: array
          - type: 'null'
          description: 'A list of LogEntry items, containing errors, warnings, debugging
            information, etc.


            List items MUST be in chronological order with earliest first.'
          title: Logs
        message:
          $ref: '#/components/schemas/Message-Output'
          description: Contains the knowledge of the response (query graph, knowledge
            graph, and results).
        parameters:
          $ref: '#/components/schemas/Parameters'
          description: Parameters used while executing the query.
        schema_version:
          anyOf:
          - type: string
          - type: 'null'
