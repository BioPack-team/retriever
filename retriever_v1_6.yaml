    MetaAttribute:
      additionalProperties: true
      description: An element describing a type of attribute that can be served.
      properties:
        attribute_source:
          anyOf:
          - type: string
          - type: 'null'
          description: Source of an attribute provided by this TRAPI web service.
          title: Attribute Source
        attribute_type_id:
          description: Type of an attribute provided by this TRAPI web service (preferably
            the CURIE of a Biolink association slot).
          title: Attribute Type Id
          type: string
        constraint_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-readable name or label for the constraint concept. Required
            whenever constraint_use is true.
