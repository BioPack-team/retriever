        constraint_use:
          default: false
          description: Indicates whether this attribute can be used as a query constraint.
          title: Constraint Use
          type: boolean
        original_attribute_names:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: Names of an the attribute as provided by the source.
          title: Original Attribute Names
      required:
      - attribute_type_id
      title: MetaAttribute
      type: object
    MetaEdge:
      additionalProperties: false
      description: Edge in a meta knowledge map describing relationship between a
        subject Biolink class and an object Biolink class.
      properties:
        association:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The Biolink association type (entity) that this edge represents.


            Associations are classes in Biolink

            that represent a relationship between two entities.

            For example, the association ''gene interacts with gene''

            is represented by the Biolink class,

            ''biolink:GeneToGeneAssociation''.  If association

            is filled out, then the testing harness can

            help validate that the qualifiers are being used

            correctly.'
          title: Association
        attributes:
          anyOf:
          - items:
              $ref: '#/components/schemas/MetaAttribute'
            type: array
          - type: 'null'
          description: Edge attributes provided by this TRAPI web service.
          title: Attributes
        knowledge_types:
          anyOf:
          - items:
              enum:
              - lookup
              - inferred
              type: string
            minItems: 1
            type: array
          - type: 'null'
          description: 'A list of knowledge_types that are supported by the service.


            If the knowledge_types is null, this means that only ''lookup''

            is supported. Currently allowed values are ''lookup'' or ''inferred''.'
          title: Knowledge Types
        object:
          description: Object node category of this relationship edge.
          title: Object
          type: string
        predicate:
          description: Biolink relationship between the subject and object categories.
          title: Predicate
          type: string
        qualifiers:
          anyOf:
          - items:
              $ref: '#/components/schemas/MetaQualifier'
            type: array
          - type: 'null'
          description: Qualifiers that are possible to be found on this edge type.
          title: Qualifiers
        subject:
          description: Subject node category of this relationship edge.
          title: Subject
          type: string
      required:
      - subject
      - predicate
      - object
      title: MetaEdge
      type: object
    MetaKnowledgeGraph:
      additionalProperties: true
      description: 'Knowledge-map representation of this TRAPI web service.


        The meta knowledge graph is composed of the union of most specific categories

        and predicates for each node and edge.'
      properties:
        edges:
          description: 'List of the most specific edges/predicates provided by this
            TRAPI web service.


            A predicate is only exposed here if there is an edge

            for which the predicate is the most specific available.'
