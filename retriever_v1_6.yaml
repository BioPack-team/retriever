        runner_parameters:
          anyOf:
          - $ref: '#/components/schemas/AllowList'
          - $ref: '#/components/schemas/DenyList'
          - type: 'null'
          title: Runner Parameters
      required:
      - id
      - parameters
      title: OperationSortResultsEdgeAttribute
      type: object
    OperationSortResultsNodeAttribute:
      additionalProperties: true
      description: 'This operation sorts the results by the given node attribute.


        If in ascending order, the minimum value of the results nodes with the given

        attribute will be taken while the maximum will be taken for descending order.
        If a

        result has no nodes with the given attribute, it will be listed last. If

        `max_results` is given, it truncates the results to at most the given value.'
      properties:
